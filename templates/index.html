<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Pipeline</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #eee;
            padding: 40px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #00cc88;
            border: none;
            cursor: pointer;
        }

        pre {
            margin-top: 20px;
            background: #1c1c1c;
            padding: 15px;
        }
    </style>
</head>
<body>

<h1>Hybrid Pipeline Engine</h1>

<textarea id="inputText" placeholder="Enter text..."></textarea>
<br>
<button onclick="runPipeline()">Run Pipeline</button>

<pre id="outputBox">Waiting...</pre>

<script>
async function runPipeline() {

    const text = document.getElementById("inputText").value;

    const payload = {
        facts: [text],
        hypotheses: [],
        speculation: [],
        questions: [],
        source: "web-ui"
    };

    const response = await fetch("/api/run", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    });

    const data = await response.json();

    document.getElementById("outputBox").textContent =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
