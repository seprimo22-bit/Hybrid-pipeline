<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hybrid Pipeline Engine</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #00cc88;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #00cc88;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #00aa70;
        }

        .output {
            margin-top: 30px;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<h1>Hybrid Pipeline Interface</h1>

<textarea id="inputText" placeholder="Enter facts, article text, or pipeline input..."></textarea>

<button onclick="runPipeline()">Run Hybrid Pipeline</button>

<div class="output" id="resultBox">
Waiting for input…
</div>

<script>
async function runPipeline() {

    const text = document.getElementById("inputText").value;

    const payload = {
        facts: [text],
        hypotheses: [],
        speculation: [],
        questions: [],
        source: "web-ui"
    };

    const response = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const data = await response.json();

    document.getElementById("resultBox").textContent =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
