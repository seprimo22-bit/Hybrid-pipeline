<!DOCTYPE html>
<html>
<head>
<title>Hybrid Integration Pipeline</title>
<style>
body { font-family: Arial; margin: 40px; }
textarea { width: 100%; height: 120px; margin-bottom: 15px; }
button { padding: 10px 20px; }
pre { background: #eee; padding: 15px; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Hybrid Integration Pipeline</h1>

<h3>Question</h3>
<textarea id="question"></textarea>

<h3>Article</h3>
<textarea id="article"></textarea>

<button onclick="run()">Run Hybrid Analysis</button>

<pre id="output">Awaiting input...</pre>

<script>
async function run() {

    const article = document.getElementById("article").value;
    const question = document.getElementById("question").value;

    const res = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            article: article,
            question: question
        })
    });

    const data = await res.json();
    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
