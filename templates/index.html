<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Integration Pipeline</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            font-size: 16px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #ffaa00;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #ffbb33;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            background: #222;
            border-left: 4px solid #ffaa00;
            white-space: pre-wrap;
            min-height: 150px;
        }
    </style>
</head>

<body>

<h1>🟡 Hybrid Integration Pipeline</h1>

<textarea id="pipelineInput"
placeholder="Paste article or reasoning text here..."></textarea>

<button onclick="runPipeline()">Run Hybrid Pipeline</button>

<div id="output">Awaiting input...</div>

<script>
async function runPipeline() {

    const inputField = document.getElementById("pipelineInput");
    const outputDiv = document.getElementById("output");

    const inputText = inputField.value.trim();

    if (!inputText) {
        outputDiv.innerText = "Please enter text for analysis.";
        return;
    }

    outputDiv.innerText = "Running 7-layer Hybrid Pipeline...";

    try {

        const response = await fetch("/run_pipeline", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ input: inputText })
        });

        const data = await response.json();

        if (data.error) {
            outputDiv.innerText = "Pipeline Error:\n" + data.error;
            return;
        }

        outputDiv.innerText = data.result;

    } catch (error) {
        outputDiv.innerText =
            "Connection error. Check server logs or deployment.";
    }
}
</script>

</body>
</html>
