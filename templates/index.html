<!DOCTYPE html>
<html>
<head>
<title>Hybrid Integration Pipeline</title>
<style>
body {
  background:#111;
  color:#eee;
  font-family:Arial;
  padding:40px;
}

textarea {
  width:100%;
  height:220px;
  background:#222;
  color:white;
  padding:12px;
  border-radius:6px;
}

button {
  padding:12px 24px;
  margin-top:15px;
  background:#00cc88;
  border:none;
  cursor:pointer;
}

pre {
  margin-top:25px;
  background:#1c1c1c;
  padding:20px;
  white-space:pre-wrap;
}
</style>
</head>
<body>

<h1>Hybrid Integration Pipeline</h1>

<textarea id="inputBox"
placeholder="Enter reasoning, research, or analysis input..."></textarea>

<br>
<button onclick="runPipeline()">Run Hybrid Pipeline</button>

<pre id="output">Awaiting input...</pre>

<script>
async function runPipeline() {

  const input = document.getElementById("inputBox").value;

  const response = await fetch("/api/run", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({input})
  });

  const data = await response.json();

  document.getElementById("output").textContent =
    data.analysis;
}
</script>

</body>
</html>
