<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Integration Pipeline</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            padding: 40px;
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #ffaa00;
            border: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            background: #222;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>Hybrid Integration Pipeline</h1>

    <textarea id="pipelineInput" placeholder="Enter your reasoning or question here..."></textarea>

    <button onclick="runPipeline()">Run Hybrid Pipeline</button>

    <div id="output">Awaiting input...</div>

<script>
async function runPipeline() {

    const input = document.getElementById("pipelineInput").value;

    const response = await fetch("/run_pipeline", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ input: input })
    });

    const data = await response.json();

    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
